{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Console{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
  <script>
    window.consoleShowError = function (message) {
      const msg = String(message);
      const modal = document.getElementById("console-flash-modal");

      const openModal = () => {
        if (!modal || !window.Alpine) return false;
        const api = window.Alpine.$data(modal);
        if (api && typeof api.show === "function") {
          api.show(msg);
          return true;
        }
        return false;
      };

      if (openModal()) return;

      let attempts = 0;
      const waitForAlpine = () => {
        if (openModal() || attempts++ > 120) return;
        window.requestAnimationFrame(waitForAlpine);
      };

      if (window.Alpine) {
        waitForAlpine();
        return;
      }

      document.addEventListener("alpine:initialized", waitForAlpine, { once: true });
    };

    window.consoleScanErrors = function (root) {
      if (!root || typeof root.querySelectorAll !== "function") return;
      root.querySelectorAll("[data-console-error]").forEach((el) => {
        const errorMessage = el.getAttribute("data-console-error");
        if (errorMessage) window.consoleShowError(errorMessage);
        el.remove();
      });
    };

    document.addEventListener("alpine:initialized", () => {
      window.consoleScanErrors(document);
    });

    document.addEventListener("alpine:init", () => {
      Alpine.data("consoleFlashModal", () => ({
        open: false,
        message: "",
        _timer: null,
        show(message) {
          this.message = String(message);
          this.open = true;
          this.resetTimer();
        },
        close() {
          this.open = false;
          this.message = "";
          if (this._timer) {
            clearTimeout(this._timer);
            this._timer = null;
          }
        },
        resetTimer() {
          if (this._timer) clearTimeout(this._timer);
          this._timer = setTimeout(() => this.close(), 10000);
        },
      }));

      Alpine.data("consoleAdminSearch", (opts = {}) => ({
        view: "data",
        q: "",
        open: false,
        settingsOpen: false,
        selected: opts.selected || "",
        tableNames: Array.isArray(opts.tableNames) ? opts.tableNames : [],
        match(name) {
          const qq = this.q.trim().toLowerCase();
          return !qq || String(name).toLowerCase().includes(qq);
        },
        get suggestions() {
          const qq = this.q.trim().toLowerCase();
          const all = this.tableNames;
          if (!qq) return all.slice(0, 10);
          return all.filter((n) => n.toLowerCase().includes(qq)).slice(0, 12);
        },
        get suggestionEmpty() {
          return this.q.trim().length > 0 && this.suggestions.length === 0;
        },
        emitFilter() {
          const q = this.q.trim();
          window.__consoleTableQ = q;
          window.dispatchEvent(
            new CustomEvent("console:filter-tables", { detail: { q } }),
          );
        },
        onInput() {
          this.open = true;
          this.emitFilter();
        },
        pickTable(name) {
          this.q = name;
          this.open = false;
          this.selected = name;
          this.emitFilter();
          if (this.view === "data") {
            const btn = this.$root.querySelector(
              '[data-table-name="' + CSS.escape(name) + '"]',
            );
            if (btn) btn.click();
          }
          if (this.view === "diagram") {
            window.dispatchEvent(
              new CustomEvent("console:focus-table", { detail: { name } }),
            );
          }
          this.$nextTick(() => {
            const card = this.$root.querySelector(
              '[data-schema-table="' + CSS.escape(name) + '"]',
            );
            if (card) card.scrollIntoView({ behavior: "smooth", block: "nearest" });
          });
        },
        clearSearch() {
          this.q = "";
          this.open = false;
          this.emitFilter();
        },
        setView(next) {
          this.view = next;
          this.$nextTick(() => this.emitFilter());
        },
      }));
    });
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="console" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% block body %}{% endblock %}
  <div
    id="console-flash-modal"
    class="console-modal"
    x-data="consoleFlashModal()"
    x-show="open"
    x-cloak
    @keydown.escape.window="open && close()"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="console-flash-modal-title"
    :aria-hidden="(!open).toString()"
  >
    <div
      class="console-modal__backdrop"
      x-show="open"
      x-transition.opacity.duration.200ms
      @click="close()"
    ></div>
    <div
      class="console-modal__dialog console-modal__dialog--error"
      x-show="open"
      x-transition.opacity.duration.200ms
      @click.stop
    >
      <button
        type="button"
        class="console-modal__close"
        @click="close()"
        aria-label="Fermer"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M18.3 5.71a1 1 0 0 0-1.41 0L12 10.59 7.11 5.7A1 1 0 0 0 5.7 7.11L10.59 12 5.7 16.89a1 1 0 1 0 1.41 1.41L12 13.41l4.89 4.89a1 1 0 0 0 1.41-1.41L13.41 12l4.89-4.89a1 1 0 0 0 0-1.4z"/>
        </svg>
      </button>
      <h2 id="console-flash-modal-title" class="console-modal__title">Erreur</h2>
      <p class="console-modal__message" x-text="message"></p>
    </div>
  </div>
  <div id="console-flash-oob" hidden aria-hidden="true"></div>
  <script>
    document.body.addEventListener("htmx:afterSwap", (event) => {
      if (window.Alpine && event.detail && event.detail.elt) {
        Alpine.initTree(event.detail.elt);
      }
      window.consoleScanErrors(event.detail.elt);
    });
    document.body.addEventListener("htmx:oobAfterSwap", (event) => {
      const target = event.detail && (event.detail.target || event.detail.el);
      if (window.Alpine && target) {
        Alpine.initTree(target);
      }
      window.consoleScanErrors(target);
    });
    document.body.addEventListener("htmx:afterSettle", () => {
      window.consoleScanErrors(document);
    });
  </script>
</body>
</html>
