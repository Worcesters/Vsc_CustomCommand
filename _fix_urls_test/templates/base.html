{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Projet{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script src="https://unpkg.com/htmx.org@2.0.4" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  {% block extra_head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header class="site-header">
    <a class="site-header__brand" href="{% url 'core:home' %}">core</a>
    <nav class="site-header__nav" aria-label="Navigation principale">
      <a class="site-header__link" href="{% url 'core:home' %}">Accueil</a>
      <a class="site-header__link" href="{% url 'core:backoffice_list' %}">Back-office</a>
    <a class="site-header__link" href="http://localhost:4321/">UI produit</a>
    <a class="site-header__link" href="/admin/">Admin</a>
      <a class="site-header__link" href="/api/health/">API</a>
    </nav>
  </header>
  <div class="layout-main">
    {% block content %}{% endblock %}
  </div>
  {% block extra_body %}{% endblock %}
</body>
</html>
